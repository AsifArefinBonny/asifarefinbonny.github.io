---
<!-- layout: default -->
---

<article class="blog-post">
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}
    <h2 class="post-subtitle" style="font-size:1.3rem;font-weight:400;color:#416eef;margin-top:-0.5em;margin-bottom:1em;">{{ page.subtitle }}</h2>
  {% endif %}
  <p class="blog-date">{{ page.date | date: "%B %d, %Y" }}</p>
  {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title }}" />
  {% endif %}
  <div class="blog-content">
    {{ content }}
  </div>
</article>
