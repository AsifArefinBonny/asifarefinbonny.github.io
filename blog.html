layout: default
title: Blog
---

<a href="/index.html" class="btn btn-secondary" style="margin-bottom: 1em;">&larr; Back to Home</a>

<h1>Blog</h1>
<ul>
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <span> - {{ post.date | date: "%B %d, %Y" }}</span>
    </li>
  {% endfor %}
</ul>
